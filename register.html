<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EduBridge</title>
    <link rel="stylesheet" href="Styles/main.css">
    <link rel="stylesheet" href="Styles/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">EduBridge</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="webdev.html">Web Development</a></li>
                <li><a href="ai.html">AI & ML</a></li>
                <li><a href="career.html">Career</a></li>
                <li>
          <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle color theme">
            <i class="fas fa-sun light-icon"></i>
            <i class="fas fa-moon dark-icon"></i>
          </button>
        </li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="auth-container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <div class="form-group">
                    <label for="interests">Areas of Interest</label>
                    <select id="interests" name="interests" multiple>
                        <option value="webdev">Web Development</option>
                        <option value="ai">AI & ML</option>
                        <option value="career">Career Development</option>
                    </select>
                </div>
                <button type="submit" class="auth-button">Register</button>
            </form>
            <div class="auth-links">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>About Us</h3>
                <p>EduBridge is dedicated to providing quality education in technology fields.</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="webdev.html">Web Development</a></li>
                    <li><a href="ai.html">AI & ML</a></li>
                    <li><a href="career.html">Career</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Follow Us</h3>
                <a href="https://x.com/shivam98997467" target="_blank" class="social-button" title="Follow us on Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts/auth.js"></script>
    <script>
</script>
</body>
</html>
